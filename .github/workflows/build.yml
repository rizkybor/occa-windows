# Builds and tests OCCA for Windows on a Windows runner and produces installable artifacts for x64 and ARM64:
#   OCCA-MSIX-<platform>  .msix signed with a per-run self-signed test certificate (+ its .cer to trust on a test PC)
#   OCCA-MSI-<platform>   .msi built with WiX from the unpackaged, self-contained publish
# Secrets (optional): OCCA_WINDOWS holds the Esri ArcGIS Location Platform API key; it is written into appsettings.json
# of the packaged app and enables the live tile test.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Version 0.1.<run> for every CI build; a v* tag (e.g. v0.1.0) overrides it below.
  APP_VERSION_BASE: "0.1"

jobs:
  test:
    name: Core tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test Occa.Core
        env:
          OCCA_ESRI_API_KEY: ${{ secrets.OCCA_WINDOWS }}
        run: dotnet test tests/Occa.Core.Tests/Occa.Core.Tests.csproj -c Release --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results

  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="${APP_VERSION_BASE}.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"

  msix:
    name: MSIX ${{ matrix.platform }}
    needs: [test, version]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2

      - name: Stamp version and Esri key
        shell: pwsh
        env:
          ESRI_API_KEY: ${{ secrets.OCCA_WINDOWS }}
          VERSION: ${{ needs.version.outputs.version }}
        run: ./build/Stamp.ps1 -Version $env:VERSION -EsriApiKey $env:ESRI_API_KEY

      - name: Create test signing certificate
        id: cert
        shell: pwsh
        run: |
          $publisher = ([xml](Get-Content src/Occa.App/Package.appxmanifest)).Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature -FriendlyName "OCCA Dev (CI)" `
            -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") -NotAfter (Get-Date).AddMonths(6)
          New-Item -ItemType Directory -Force artifacts/cert | Out-Null
          $password = ConvertTo-SecureString -String "occa-dev" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath artifacts/cert/OCCA-Dev.pfx -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath artifacts/cert/OCCA-Dev.cer | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build MSIX
        shell: pwsh
        run: |
          msbuild src/Occa.App/Occa.App.csproj -restore -nologo -v:minimal `
            -p:Configuration=Release -p:Platform=${{ matrix.platform }} -p:RuntimeIdentifier=${{ matrix.rid }} `
            -p:WindowsPackageType=MSIX -p:GenerateAppxPackageOnBuild=true -p:AppxBundle=Never `
            -p:AppxPackageDir="$PWD/artifacts/msix/${{ matrix.platform }}/" `
            -p:AppxPackageSigningEnabled=false

      - name: Sign MSIX with the test certificate
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          $packages = Get-ChildItem artifacts/msix -Recurse -Include *.msix
          if (-not $packages) { throw "no .msix produced" }
          # Trust the test certificate on the runner the same way a test PC does, so `verify` checks the full chain.
          Import-Certificate -FilePath artifacts/cert/OCCA-Dev.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Import-Certificate -FilePath artifacts/cert/OCCA-Dev.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          foreach ($p in $packages) {
            & $signtool sign /fd SHA256 /f artifacts/cert/OCCA-Dev.pfx /p occa-dev $p.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $($p.Name)" }
            & $signtool verify /pa /v $p.FullName
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed for $($p.Name)" }
          }

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/out | Out-Null
          Get-ChildItem artifacts/msix -Recurse -Include *.msix | Copy-Item -Destination artifacts/out
          Copy-Item artifacts/cert/OCCA-Dev.cer artifacts/out
          Get-ChildItem artifacts/out

      - uses: actions/upload-artifact@v4
        with:
          name: OCCA-MSIX-${{ matrix.platform }}
          path: artifacts/out

  msi:
    name: MSI ${{ matrix.platform }}
    needs: [test, version]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
            wix: x64
          - platform: ARM64
            rid: win-arm64
            wix: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Stamp version and Esri key
        shell: pwsh
        env:
          ESRI_API_KEY: ${{ secrets.OCCA_WINDOWS }}
          VERSION: ${{ needs.version.outputs.version }}
        run: ./build/Stamp.ps1 -Version $env:VERSION -EsriApiKey $env:ESRI_API_KEY

      - name: Publish unpackaged app
        shell: pwsh
        run: |
          dotnet publish src/Occa.App/Occa.App.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} `
            -p:WindowsPackageType=None -o artifacts/publish/${{ matrix.platform }}

      - name: Build MSI (WiX)
        shell: pwsh
        run: |
          dotnet build installer/wix/Occa.Installer.wixproj -c Release -p:InstallerPlatform=${{ matrix.wix }} `
            -p:PublishDir="$PWD/artifacts/publish/${{ matrix.platform }}" -p:ProductVersion=${{ needs.version.outputs.version }} `
            -o artifacts/msi/${{ matrix.platform }}
          Get-ChildItem artifacts/msi/${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: OCCA-MSI-${{ matrix.platform }}
          path: artifacts/msi/${{ matrix.platform }}/*.msi
